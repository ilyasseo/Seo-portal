    let currentLang = 'en';
    let currentIndex = 0;

    function renderUI() {
        const data = dataset[currentLang];
        const lesson = data.lessons[currentIndex];
        
        // Update Sidebar Title Header
        document.getElementById('sidebarHeader').innerText = data.sidebar;
        
        // Update Active Video Text
        document.getElementById('lblTitle').innerText = lesson.title;
        document.getElementById('lblDesc').innerText = lesson.desc;
        
        // Update Playlist Card Labels
        for(let i = 0; i < data.lessons.length; i++) {
            const cardEl = document.getElementById(`cardTitle${i}`);
            cardEl.innerText = data.lessons[i].card;
            
            // Adjust text alignments based on language selection
            if(currentLang === 'ur') {
                cardEl.parentElement.parentElement.classList.add('rtl');
            } else {
                cardEl.parentElement.parentElement.classList.remove('rtl');
            }
        }

        // Apply visual alignment layout shifts to main description window
        const detailsEl = document.getElementById('activeDetails');
        if(currentLang === 'ur') {
            detailsEl.classList.add('rtl');
        } else {
            detailsEl.classList.remove('rtl');
        }
    }

    function selectCard(index, element) {
        currentIndex = index;
        
        // Update the video engine source frame smoothly
        const videoId = dataset[currentLang].lessons[currentIndex].video;
        document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${videoId}`;
        
        // Sync active selection styles highlights
        const cards = document.getElementsByClassName('module-card');
        for(let i=0; i<cards.length; i++) {
            cards[i].classList.remove('active');
        }
        element.classList.add('active');
        
        renderUI();
    }

    function switchLanguage(lang) {
        currentLang = lang;
        
        // Update navigation active states
        document.getElementById('btnEn').classList.remove('active');
        document.getElementById('btnUr').classList.remove('active');
        
        document.getElementById(lang === 'en' ? 'btnEn' : 'btnUr').classList.add('active');
        
        renderUI();
    }
</script>
